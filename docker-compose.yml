services:
  postgres:
    image: postgres:16
    container_name: sgcursos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sgcursos
    ports:
      - "5432:5432"
    volumes:
      - sgcursos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: sgcursos-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/sgcursos?schema=public"
      JWT_SECRET: "troque-por-uma-chave-longa-e-aleatoria-guilherme-2026"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: sgcursos-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  sgcursos_pgdata:
